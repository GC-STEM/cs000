name: Report an accessibility barrier
description: Report something in the course repository that is difficult or impossible to access or use.
title: "[Accessibility] "

body:
  - type: dropdown
    id: submitter
    attributes:
      label: Submitter
      description: Who is submitting this report?
      options:
        - Student
        - Faculty
        - Other
    validations:
      required: true

  - type: textarea
    id: barrier
    attributes:
      label: What accessibility barrier did you encounter?
      description: Briefly describe what you were trying to do and what made it difficult or impossible.
      placeholder: I was trying to... The barrier was...
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Where did the barrier occur?
      description: Identify the page, file, activity, link, image, diagram, video, or other content involved.
      placeholder: Page, file, activity, or URL...
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Optional. Add your browser, operating system, assistive technology, steps to reproduce, screenshots, or other information that may help us understand the barrier. You do not need to disclose a disability or diagnosis. Do not include passwords, access tokens, or other sensitive information.
      placeholder: Add any helpful details here.
    validations:
      required: false
